dataset:
  eval_ratio: 0.2
  n_tasks: 5
  name: SplitMNIST
  seed: 42
  test_ratio: 0.2
model:
  batch: 128
  criterion: CrossEntropyLoss
  dropout: 0.5
  epochs: 4
  hidden_dims: 128
  input_dim: 784
  lr: 0.01
  optimizer: SGD
  output_dim: 10
  type: SimpleMLP
strategies:
- buffer_size: 500
  class_name: HillClimbingStart
  n_calls: 100
  name: HillClimbingStart swaps 1
  params:
    swaps: 1
- buffer_size: 500
  class_name: HillClimbingStart
  n_calls: 100
  name: HillClimbingStart swaps 10
  params:
    swaps: 10
- buffer_size: 500
  class_name: HillClimbingStart
  n_calls: 100
  name: HillClimbingStart swaps 50
  params:
    swaps: 50
