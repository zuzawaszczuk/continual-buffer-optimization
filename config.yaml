dataset: 
  name: "SplitMNIST"
  n_tasks: 5
  eval_ratio: 0.2
  test_ratio: 0.2
  seed: 42

model:
  type: "SimpleMLP"
  input_dim: 784
  hidden_dims: 128
  output_dim: 10
  optimizer: "SGD"
  lr: 0.01
  dropout: 0.5
  criterion: "CrossEntropyLoss"
  epochs: 2
  batch: 128

strategies:
  - name: "HillClimbing"
    buffer_size: 500
    n_calls: 10
    params: {
      restart: 5
    } 
  - name: "RandomSearch"
    buffer_size: 500
    n_calls: 10
    params: {}
  - name: "Genetic"
    buffer_size: 500
    n_calls: 10
    params: {
      epochs: 2,
      population: 5,
      mutation_rate: 0.1,
      reproduce_rate: 0.1,
      elite_size: 2,
      tournament_size: 2
    }
      

