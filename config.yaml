Objective:
    dataset: 
      name: "MNIST"
      n_tasks: 3
      classes_per_task: 2
      eval_ratio: 0.2
      test_ratio: 0.2
      seed: 42

    model:
      type: "SimpleMLP"
      input_dim: 784
      hidden_dims: 128
      optimizer: "SGD"
      lr: 0.01
      criterion: "CrossEntropyLoss"


