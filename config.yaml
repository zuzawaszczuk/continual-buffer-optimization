dataset:
  name: "SplitMNIST"
  n_tasks: 3
  eval_ratio: 0.2
  test_ratio: 0.2
  seed: 42

model:
  type: "SimpleMLP"
  input_dim: 784
  hidden_dims: 128 
  output_dim: 10
  optimizer: "SGD"
  lr: 0.01
  dropout: 0.5
  criterion: "CrossEntropyLoss"
  epochs: 5
  batch: 512

strategies:
  - name: "RandomSearch"
    buffer_size: 500
    n_calls: 500
    params: {}
  - name: "HillClimbing"
    buffer_size: 500
    n_calls: 500
    params: {
      restart: 5
    } 
  - name: "Genetic"
    buffer_size: 500
    n_calls: 500
    params: {
      epochs: 25,
      population: 20,
      mutation_rate: 0.1,
      reproduce_rate: 0.9,
      n_elite: 2,
      tournament_size: 4
    }
  - name: "PBIL"
    buffer_size: 500
    n_calls: 500
    params: {
      epochs: 25,
      population: 20,
      learning_rate: 0.15,
      mutation_prob: 0.02,
      mutation_shift: 0.05
    }