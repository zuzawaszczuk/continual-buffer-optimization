dataset:
  eval_ratio: 0.2
  n_tasks: 2
  name: SplitCIFAR10
  seed: 42
  test_ratio: 0.2
model:
  batch: 512
  criterion: CrossEntropyLoss
  dropout: 0.5
  epochs: 5
  hidden_dims: 128
  input_dim: 784
  lr: 0.01
  optimizer: SGD
  output_dim: 10
  type: SimpleCNN
strategies:
- buffer_size: 500
  n_calls: 50
  name: RandomSearch
  params: {}
- buffer_size: 500
  n_calls: 50
  name: HillClimbing
  params:
    restart: 5
- buffer_size: 500
  n_calls: 50
  name: Genetic
  params:
    epochs: 25
    mutation_rate: 0.1
    n_elite: 2
    population: 5
    reproduce_rate: 0.9
    tournament_size: 4
- buffer_size: 500
  n_calls: 50
  name: PBIL
  params:
    epochs: 25
    learning_rate: 0.15
    mutation_prob: 0.02
    mutation_shift: 0.05
    population: 5
