dataset:
  eval_ratio: 0.2
  n_tasks: 5
  name: SplitCIFAR10
  seed: 42
  test_ratio: 0.2
model:
  batch: 512
  criterion: CrossEntropyLoss
  dropout: 0.5
  epochs: 20
  hidden_dims: 512
  input_dim: 3072
  lr: 0.01
  optimizer: SGD
  output_dim: 10
  type: SimpleMLP
strategies:
- buffer_size: 500
  n_calls: 50
  name: HillClimbing
  params:
    restart: 2
- buffer_size: 500
  n_calls: 50
  name: Genetic
  params:
    elite_size: 5
    epochs: 20
    mutation_rate: 0.5
    population: 40
    reproduce_rate: 0.1
    tournament_size: 3
